apis:
- aid: vidcruiter:vidcruiter-partner-integration-api
  name: VidCruiter Partner Integration API
  tags:
  - Integration
  - Web Services
  - ATS
  - Partner
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://vidcruiter.com/integrations/
  endpointsModeled: true
  accessModel: partner-gated
  properties:
  - url: https://vidcruiter.com/integrations/
    type: Documentation
  - url: https://knowledge.technolutions.net/docs/vidcruiter-integration
    type: IntegrationGuide
  description: >-
    The real, documented programmatic surface. VidCruiter provisions each
    institution a unique web-services API endpoint (obtained from a VidCruiter
    account representative) used for bidirectional integration with a system of
    record. In the documented Slate pattern, the ATS pushes application records
    to VidCruiter via a web-service export authenticated with a user token
    passed as a query string, and VidCruiter returns a ShareableProfileUrl for
    each completed interview via an API call, using a timestamp parameter so
    only new records are retrieved. Endpoints are per-tenant and account
    provisioned; no public base URL or reference is published.
- aid: vidcruiter:vidcruiter-candidates-api
  name: VidCruiter Candidates API
  tags:
  - Candidates
  - Applicants
  - Recruitment
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://vidcruiter.com/integrations/
  endpointsModeled: true
  accessModel: partner-gated
  properties:
  - url: https://vidcruiter.com/integrations/
    type: Documentation
  description: >-
    Honestly modeled, not sourced from a public reference. A logical resource
    for candidate and applicant records synchronized between VidCruiter and an
    ATS/HRIS - creating candidates, attaching application data, and retrieving
    candidate status. VidCruiter does not publish endpoints, schemas, or a base
    URL for this resource; any concrete surface is provisioned per tenant
    through an account representative.
- aid: vidcruiter:vidcruiter-interviews-api
  name: VidCruiter Interviews API
  tags:
  - Interviews
  - Video Interviewing
  - Scheduling
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://vidcruiter.com/integrations/
  endpointsModeled: true
  accessModel: partner-gated
  properties:
  - url: https://vidcruiter.com/integrations/
    type: Documentation
  description: >-
    Honestly modeled, not sourced from a public reference. A logical resource
    for pre-recorded and live video interviews - inviting candidates,
    provisioning interview sessions, and retrieving completed interview results
    such as the shareable interview profile URL that VidCruiter returns to a
    system of record. VidCruiter does not publish endpoints, schemas, or a base
    URL; the concrete surface is account provisioned.
- aid: vidcruiter:vidcruiter-evaluations-api
  name: VidCruiter Evaluations API
  tags:
  - Evaluations
  - Ratings
  - Scoring
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://vidcruiter.com/integrations/
  endpointsModeled: true
  accessModel: partner-gated
  properties:
  - url: https://vidcruiter.com/integrations/
    type: Documentation
  description: >-
    Honestly modeled, not sourced from a public reference. A logical resource
    for evaluator ratings, scorecards, and reference-check results tied to a
    candidate's interviews. VidCruiter does not publish endpoints, schemas, or a
    base URL for evaluations; any programmatic access is provisioned per tenant
    through an account representative.
