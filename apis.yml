name: VidCruiter
kind: company
description: >-
  VidCruiter is a Moncton, Canada based recruitment technology company that
  provides a modular hiring platform - pre-recorded and live video interviewing,
  automated interview scheduling, skills and pre-employment testing, automated
  reference checking, audio interviews, and video proctoring. VidCruiter does
  not publish a public, self-service developer API. Its programmatic surface is
  a partner and enterprise integration capability: pre-built connectors to major
  ATS/HCM, background-check, calendar, job-board, SSO, and video-conferencing
  providers, plus a bidirectional web-services integration in which an
  institution's unique, account-provisioned API endpoint is exchanged with a
  system of record (for example Slate) to push application records into
  VidCruiter and pull completed interview results back out. API access is gated
  behind a VidCruiter account representative; there is no public API reference,
  OpenAPI document, base URL, or self-serve key issuance.
